name: Deploy Dino Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out deploy sources only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            app.js
            gallery-slots.js
            ecosystem-scenes.js
            motion-samples.js
            styles.css
            atlas-layout.js
            assets/motion/
          sparse-checkout-cone-mode: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build compact Pages artifact
        env:
          ASSET_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/assets/dinosaurs/
        run: |
          mkdir -p _site/assets/motion
          cp index.html app.js gallery-slots.js ecosystem-scenes.js motion-samples.js styles.css atlas-layout.js _site/
          cp assets/motion/*.mp4 _site/assets/motion/
          python3 - <<'PY'
          import os
          from pathlib import Path

          base = os.environ["ASSET_BASE"]
          for name in ("app.js", "gallery-slots.js", "ecosystem-scenes.js", "motion-samples.js"):
              path = Path("_site") / name
              path.write_text(
                  path.read_text(encoding="utf-8").replace("assets/dinosaurs/", base),
                  encoding="utf-8",
              )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
