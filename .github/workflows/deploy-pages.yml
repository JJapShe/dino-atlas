name: Deploy Dino Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out deploy sources only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            access-policy.js
            admin.html
            app.js
            gallery-slots.js
            ecosystem-scenes.js
            motion-samples.js
            motion-m1-samples.js
            motion-m2-samples.js
            motion-m2-i2v-samples.js
            motion-public-assets.json
            styles.css
            atlas-layout.js
            assets/motion/
            .github/workflows/deploy-pages.yml
            tools/verify_access_surfaces.mjs
            tools/comfyui/scripts/verify_motion_public_assets.mjs
          sparse-checkout-cone-mode: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build compact Pages artifact
        env:
          ASSET_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/assets/dinosaurs/
        run: |
          node tools/verify_access_surfaces.mjs
          node tools/comfyui/scripts/verify_motion_public_assets.mjs
          mkdir -p _site
          cp index.html access-policy.js app.js gallery-slots.js ecosystem-scenes.js motion-samples.js motion-m1-samples.js motion-m2-samples.js motion-m2-i2v-samples.js motion-public-assets.json styles.css atlas-layout.js _site/
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          base = os.environ["ASSET_BASE"]
          for name in ("app.js", "gallery-slots.js", "ecosystem-scenes.js", "motion-samples.js", "motion-m1-samples.js", "motion-m2-samples.js", "motion-m2-i2v-samples.js"):
              path = Path("_site") / name
              path.write_text(
                  path.read_text(encoding="utf-8").replace("assets/dinosaurs/", base),
                  encoding="utf-8",
              )

          manifest = json.loads(Path("motion-public-assets.json").read_text(encoding="utf-8"))
          for asset in manifest["assets"]:
              source = Path(asset["src"])
              destination = Path("_site") / source
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY
          test ! -e _site/admin.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
