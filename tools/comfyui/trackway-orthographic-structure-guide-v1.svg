<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="mud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f8d83"/>
      <stop offset="0.15" stop-color="#928d7a"/>
      <stop offset="1" stop-color="#756f61"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dy="3" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.07 0 0 0 0 0.06 0 0 0 0.55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="left-pair" filter="url(#soft-shadow)" fill="#302d28">
      <ellipse cx="0" cy="0" rx="28" ry="38" transform="rotate(-8)"/>
      <path d="M -20 -50 Q 0 -68 20 -50 Q 12 -35 0 -38 Q -12 -35 -20 -50 Z"/>
    </g>
    <g id="right-pair" filter="url(#soft-shadow)" fill="#302d28">
      <ellipse cx="0" cy="0" rx="28" ry="38" transform="rotate(8)"/>
      <path d="M -20 -50 Q 0 -68 20 -50 Q 12 -35 0 -38 Q -12 -35 -20 -50 Z"/>
    </g>
    <g id="theropod-print" filter="url(#soft-shadow)" fill="#24221f">
      <ellipse cx="0" cy="7" rx="10" ry="13"/>
      <path d="M -6 2 L -34 -31 Q -39 -39 -31 -43 Q -24 -45 -20 -36 L -1 -6 Z"/>
      <path d="M -3 -2 L -4 -50 Q -4 -60 4 -60 Q 12 -58 10 -49 L 6 -2 Z"/>
      <path d="M 4 2 L 29 -31 Q 35 -39 42 -34 Q 47 -28 39 -22 L 10 -3 Z"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#mud)"/>
  <path d="M0 0H1600V70C1380 55 1200 82 980 65C720 45 430 82 0 58Z" fill="#6e8f8d" opacity="0.72"/>
  <path d="M0 55C390 80 720 43 1010 68C1240 87 1410 55 1600 73" fill="none" stroke="#b6ad8d" stroke-width="18" opacity="0.6"/>

  <!-- Four broad sauropod lanes. Each lane alternates complete left and right manus-pes pairs. -->
  <g>
    <use href="#left-pair" x="278" y="820"/><use href="#right-pair" x="382" y="720"/>
    <use href="#left-pair" x="278" y="620"/><use href="#right-pair" x="382" y="520"/>
    <use href="#left-pair" x="278" y="420"/><use href="#right-pair" x="382" y="320"/>
    <use href="#left-pair" x="278" y="220"/><use href="#right-pair" x="382" y="120"/>
  </g>
  <g>
    <use href="#left-pair" x="598" y="820"/><use href="#right-pair" x="702" y="720"/>
    <use href="#left-pair" x="598" y="620"/><use href="#right-pair" x="702" y="520"/>
    <use href="#left-pair" x="598" y="420"/><use href="#right-pair" x="702" y="320"/>
    <use href="#left-pair" x="598" y="220"/><use href="#right-pair" x="702" y="120"/>
  </g>
  <g>
    <use href="#left-pair" x="918" y="820"/><use href="#right-pair" x="1022" y="720"/>
    <use href="#left-pair" x="918" y="620"/><use href="#right-pair" x="1022" y="520"/>
    <use href="#left-pair" x="918" y="420"/><use href="#right-pair" x="1022" y="320"/>
    <use href="#left-pair" x="918" y="220"/><use href="#right-pair" x="1022" y="120"/>
  </g>
  <g>
    <use href="#left-pair" x="1238" y="820"/><use href="#right-pair" x="1342" y="720"/>
    <use href="#left-pair" x="1238" y="620"/><use href="#right-pair" x="1342" y="520"/>
    <use href="#left-pair" x="1238" y="420"/><use href="#right-pair" x="1342" y="320"/>
    <use href="#left-pair" x="1238" y="220"/><use href="#right-pair" x="1342" y="120"/>
  </g>

  <!-- One coherent diagonal tridactyl trail. -->
  <g>
    <use href="#theropod-print" transform="translate(95 105) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(210 165) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(325 225) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(440 285) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(555 345) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(670 405) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(785 465) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(900 525) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(1015 585) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(1130 645) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(1245 705) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(1360 765) rotate(-64) scale(.72)"/>
    <use href="#theropod-print" transform="translate(1475 825) rotate(-64) scale(.72)"/>
  </g>
</svg>
