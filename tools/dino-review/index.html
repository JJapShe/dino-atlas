<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dino Asset Review</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #151a20;
      --panel-2: #10141a;
      --line: #2b333e;
      --text: #edf2f7;
      --muted: #91a0ae;
      --accent: #6ec3b2;
      --warn: #f0b85a;
      --bad: #f46f78;
      --good: #45d184;
      --list-pane-width: 52vw;
      --card-min-width: 218px;
      --detail-review-width: clamp(320px, 29vw, 430px);
    }
    * { box-sizing: border-box; }
    html,
    body {
      width: 100%;
      height: 100%;
    }
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 320px;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
    }
    body.zoom-open { overflow: hidden; }
    header {
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(210px, auto) minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      min-width: 0;
      padding: 12px 16px;
      background: #0f1318;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }
    .toolbar {
      display: grid;
      grid-template-columns:
        minmax(170px, 1fr)
        minmax(126px, 0.62fr)
        minmax(160px, 0.9fr)
        minmax(120px, 0.62fr)
        minmax(116px, 0.58fr)
        minmax(136px, 0.7fr)
        38px;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    input, select, textarea, button { font: inherit; }
    input, select, textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
    }
    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      min-height: 34px;
      padding: 7px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .refresh-button {
      width: 38px;
      min-width: 38px;
      height: 36px;
      min-height: 36px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }
    .refresh-button[aria-busy="true"] {
      color: var(--accent);
      cursor: wait;
    }
    main {
      display: grid;
      grid-template-columns:
        minmax(420px, var(--list-pane-width))
        8px
        minmax(420px, 1fr);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    body.detail-collapsed main {
      grid-template-columns: minmax(0, 1fr);
    }
    body.detail-collapsed .pane-resizer,
    body.detail-collapsed #detail {
      display: none;
    }
    body.detail-focused main {
      grid-template-columns: minmax(0, 1fr);
    }
    body.detail-focused .browser-pane,
    body.detail-focused .pane-resizer {
      display: none;
    }
    body.detail-focused #detail {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-left: 0;
    }
    .browser-pane {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 0 14px 20px;
      scrollbar-gutter: stable;
    }
    .browser-pane-toolbar {
      position: sticky;
      z-index: 4;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      margin: 0 -14px 12px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 13, 16, 0.96);
      backdrop-filter: blur(12px);
    }
    .browser-pane-title {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
    }
    .browser-pane-title strong {
      font-size: 14px;
      white-space: nowrap;
    }
    .list-status {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .browser-actions,
    .density-control {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
    }
    .density-control {
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
    }
    .density-control button,
    .panel-toggle {
      display: grid;
      width: 32px;
      min-width: 32px;
      height: 30px;
      min-height: 30px;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
    }
    .density-control button:hover,
    .density-control button.active,
    .panel-toggle:hover {
      border-color: transparent;
      background: rgba(110, 195, 178, 0.13);
      color: var(--text);
    }
    .density-control button.active {
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, var(--line));
    }
    .density-icon {
      display: grid;
      width: 16px;
      height: 14px;
      grid-template-columns: repeat(var(--density-columns, 2), 1fr);
      gap: 2px;
    }
    .density-icon::before {
      grid-column: 1 / -1;
      width: 100%;
      height: 100%;
      content: "";
      background:
        repeating-linear-gradient(
          90deg,
          currentColor 0 3px,
          transparent 3px calc(3px + var(--density-gap, 2px))
        ),
        repeating-linear-gradient(
          0deg,
          currentColor 0 3px,
          transparent 3px 5px
        );
      opacity: 0.9;
    }
    .density-icon.comfortable {
      --density-gap: 3px;
    }
    .density-icon.large {
      --density-gap: 5px;
    }
    .panel-icon {
      position: relative;
      display: block;
      width: 17px;
      height: 14px;
      border: 1px solid currentColor;
      border-radius: 2px;
    }
    .panel-icon::after {
      position: absolute;
      top: 1px;
      right: 4px;
      bottom: 1px;
      border-left: 1px solid currentColor;
      content: "";
    }
    .pane-resizer {
      position: relative;
      z-index: 3;
      min-width: 8px;
      background: #0f1318;
      cursor: col-resize;
      touch-action: none;
    }
    .pane-resizer::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 54px;
      border-radius: 2px;
      background: var(--line);
      content: "";
      transform: translate(-50%, -50%);
    }
    .pane-resizer:hover::after,
    .pane-resizer:focus-visible::after,
    body.resizing-panes .pane-resizer::after {
      background: var(--accent);
    }
    body.resizing-panes {
      cursor: col-resize;
      user-select: none;
    }
    .summary {
      display: flex;
      gap: 8px;
      color: var(--muted);
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--card-min-width)), 1fr));
      grid-auto-flow: row;
      grid-auto-rows: max-content;
      gap: 12px;
      align-content: start;
    }
    main[data-density="compact"] { --card-min-width: 174px; }
    main[data-density="comfortable"] { --card-min-width: 218px; }
    main[data-density="large"] { --card-min-width: 332px; }
    .card {
      display: grid;
      grid-template-rows: auto minmax(112px, 1fr);
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
      min-width: 0;
      text-align: left;
      padding: 0;
      content-visibility: auto;
      contain: layout paint style;
      contain-intrinsic-size: auto 316px;
      isolation: isolate;
    }
    .card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 64%, transparent);
    }
    .thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      background: #0f1318;
    }
    .meta {
      padding: 8px;
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .card-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
      align-items: start;
    }
    .card-name-block {
      display: grid;
      min-width: 0;
      gap: 2px;
    }
    .card-species {
      min-width: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
      line-height: 1.28;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      word-break: keep-all;
    }
    .card-scientific {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-kind {
      overflow: hidden;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-name {
      overflow: hidden;
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 10px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
    }
    main[data-density="compact"] .meta {
      gap: 4px;
      padding: 7px;
    }
    main[data-density="compact"] .card {
      grid-template-rows: auto minmax(88px, 1fr);
      contain-intrinsic-size: auto 244px;
    }
    main[data-density="compact"] .card-species {
      font-size: 12px;
    }
    main[data-density="compact"] .file-name {
      -webkit-line-clamp: 1;
    }
    main[data-density="compact"] .card-heading .pill {
      display: none;
    }
    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      min-width: 0;
    }
    .card .pill {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-pass { color: var(--good); border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
    .status-hold { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
    .status-reject { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
    .scope-pending { color: #8bd5ff; border-color: color-mix(in srgb, #8bd5ff 55%, var(--line)); }
    .scope-integration { color: #c6a6ff; border-color: color-mix(in srgb, #c6a6ff 55%, var(--line)); }
    .scope-atlas { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
    .scope-unknown { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
    aside {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      border-left: 1px solid var(--line);
      background: var(--panel);
      scrollbar-gutter: stable;
    }
    .detail-pane-bar {
      position: sticky;
      z-index: 3;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(21, 26, 32, 0.96);
      backdrop-filter: blur(12px);
    }
    .detail-pane-bar strong {
      color: var(--muted);
      font-size: 12px;
    }
    .detail-pane-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .detail-position {
      min-width: 42px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      white-space: nowrap;
    }
    .detail-action,
    .detail-close {
      display: grid;
      width: 32px;
      min-width: 32px;
      height: 30px;
      min-height: 30px;
      place-items: center;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }
    .detail-action {
      color: var(--muted);
      font-size: 18px;
    }
    .detail-action:hover,
    .detail-action[aria-pressed="true"] {
      color: var(--text);
      background: rgba(110, 195, 178, 0.13);
    }
    .detail-action:disabled {
      opacity: 0.34;
      cursor: default;
    }
    .detail-layout,
    .detail-preview-column {
      min-width: 0;
      min-height: 0;
    }
    .preview-button {
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #080a0d;
      display: block;
      cursor: zoom-in;
    }
    .preview-button:hover { border: 0; }
    .preview {
      width: 100%;
      min-height: 300px;
      max-height: 62vh;
      object-fit: contain;
      background: #080a0d;
      display: block;
    }
    .species-strip {
      display: none;
      min-width: 0;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: #0d1116;
      scrollbar-gutter: stable;
    }
    .species-strip button {
      position: relative;
      width: 132px;
      min-width: 132px;
      height: 82px;
      min-height: 82px;
      overflow: hidden;
      padding: 0;
      border-radius: 5px;
      background: #080a0d;
    }
    .species-strip button.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .species-strip img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .species-strip .strip-kind {
      position: absolute;
      right: 4px;
      bottom: 4px;
      left: 4px;
      overflow: hidden;
      padding: 3px 5px;
      border-radius: 3px;
      background: rgba(4, 7, 10, 0.78);
      color: var(--text);
      font-size: 9px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .detail {
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .detail h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.35;
      word-break: break-word;
    }
    .detail-file-name {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .detail .mono { overflow-wrap: anywhere; }
    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .actions button[data-status="pass"].active { border-color: var(--good); color: var(--good); }
    .actions button[data-status="hold"].active { border-color: var(--warn); color: var(--warn); }
    .actions button[data-status="reject"].active { border-color: var(--bad); color: var(--bad); }
    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.45;
    }
    .save-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .save-row button {
      background: color-mix(in srgb, var(--accent) 26%, var(--panel));
      border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
    }
    .candidate-panel {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
    }
    .candidate-panel .meta-line {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .metadata-details {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
    }
    .metadata-details summary {
      padding: 10px;
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }
    .metadata-details[open] summary { border-bottom: 1px solid var(--line); }
    .metadata-sections {
      display: grid;
      gap: 14px;
      min-width: 0;
      padding: 10px;
    }
    .metadata-section {
      display: grid;
      gap: 7px;
      min-width: 0;
    }
    .toolbar > * { min-width: 0; }
    .metadata-section h3 {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .metadata-grid {
      display: grid;
      grid-template-columns: minmax(92px, 0.34fr) minmax(0, 1fr);
      gap: 1px;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--line);
    }
    .metadata-grid dt,
    .metadata-grid dd {
      min-width: 0;
      margin: 0;
      padding: 7px 8px;
      background: #0d1116;
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .metadata-grid dt { color: var(--muted); }
    .metadata-grid dd { color: var(--text); }
    .read-only-panel {
      display: grid;
      gap: 8px;
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: color-mix(in srgb, var(--panel-2) 86%, #c6a6ff 14%);
    }
    .read-only-panel .meta-line {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .promotion-record {
      max-width: 100%;
      margin: 0;
      overflow-x: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #090c10;
      color: var(--muted);
      font: 11px/1.5 Consolas, "Cascadia Mono", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .metadata-issues {
      margin: 0;
      padding-left: 18px;
      color: var(--warn);
      font-size: 12px;
      line-height: 1.45;
    }
    .candidate-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .candidate-actions .promote { border-color: var(--good); color: var(--good); }
    .candidate-actions .delete { border-color: var(--bad); color: var(--bad); }
    .candidate-actions button:disabled { opacity: 0.42; cursor: not-allowed; }
    body.detail-focused .detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--detail-review-width);
      min-height: 0;
      overflow: hidden;
    }
    body.detail-focused .detail-preview-column {
      display: grid;
      grid-template-rows: minmax(0, 1fr) 103px;
      overflow: hidden;
      background: #080a0d;
    }
    body.detail-focused .preview-button {
      height: 100%;
      min-height: 0;
    }
    body.detail-focused .preview {
      height: 100%;
      min-height: 0;
      max-height: none;
    }
    body.detail-focused .species-strip {
      display: flex;
    }
    body.detail-focused .detail {
      align-content: start;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 20px;
      border-left: 1px solid var(--line);
      scrollbar-gutter: stable;
    }
    .load-more {
      display: block;
      width: min(100%, 420px);
      min-height: 42px;
      margin: 18px auto 0;
      color: var(--accent);
    }
    .load-more[hidden] {
      display: none;
    }
    .empty-state {
      grid-column: 1 / -1;
      display: grid;
      min-height: 220px;
      place-items: center;
      border: 1px dashed var(--line);
      border-radius: 6px;
      color: var(--muted);
    }
    .zoom {
      position: fixed;
      inset: 0;
      width: 100vw;
      max-width: 100vw;
      min-width: 0;
      z-index: 20;
      display: block;
      overflow: hidden;
      background: rgba(3, 5, 8, 0.96);
    }
    .zoom[hidden] { display: none; }
    .zoom > * { min-width: 0; }
    .zoom-bar,
    .zoom-caption {
      display: flex;
      position: absolute;
      z-index: 3;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      gap: 12px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(10, 14, 18, 0.88);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(14px);
    }
    .zoom-bar {
      top: 12px;
      right: 12px;
      left: 12px;
    }
    .zoom-caption {
      right: 12px;
      bottom: 12px;
      left: 12px;
    }
    .zoom-tools {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
    }
    .zoom-tools button {
      min-width: 40px;
      min-height: 34px;
      padding: 5px 9px;
    }
    .zoom-count {
      min-width: 48px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      white-space: nowrap;

    .zoom-stage {

    .zoom-stage img {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;

    .zoom.actual-size .zoom-stage {
      display: block;
      overflow: auto;
      padding: 70px 76px;
    }
    .zoom.actual-size .zoom-stage img {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      margin: auto;
      cursor: zoom-out;
    }
    .zoom-nav {
      position: absolute;
      z-index: 4;
      top: 50%;
      display: grid;
      width: 48px;
      min-width: 48px;
      height: 58px;
      min-height: 58px;
      place-items: center;
      padding: 0;
      border-color: rgba(145, 160, 174, 0.38);
      background: rgba(10, 14, 18, 0.76);
      font-size: 32px;
      line-height: 1;

      backdrop-filter: blur(10px);
    }
    .zoom-nav.prev { left: 12px; }
    .zoom-nav.next { right: 12px; }
    .zoom-nav:disabled {
      opacity: 0.28;
      cursor: default;
    }
    .muted { color: var(--muted); }
    .mono { font-family: Consolas, "Cascadia Mono", monospace; }
    @media (max-width: 1480px) {
      header { grid-template-columns: 1fr; }
    }
    @media (max-width: 1180px) {
      .toolbar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      main {
        grid-template-columns:
          minmax(380px, var(--list-pane-width))
          8px
          minmax(360px, 1fr);
      }
    }
    @media (max-width: 820px) {
      body {
        display: block;
        height: auto;
        min-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
      }
      header {
        position: sticky;
        top: 0;
      }
      main,
      body.detail-collapsed main {
        display: block;
        min-height: calc(100dvh - 154px);
        overflow: visible;
      }
      .browser-pane {
        min-height: calc(100dvh - 154px);

      }

      }
      body.detail-focused .detail-layout {

      }

    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Dino Asset Review</h1>
      <div class="summary" id="summary"></div>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="생물명, 파일명 검색">
      <select id="scope" aria-label="자산 범위">
        <option value="pending">검수 대기</option>
        <option value="integration">앱 등록 대기</option>
        <option value="all">전체 자산</option>
        <option value="atlas">등록 자산</option>
        <option value="unknown">미분류/오류</option>
      </select>
      <select id="species"></select>
      <select id="kind"></select>
      <select id="status">
        <option value="all">전체 상태</option>
        <option value="unreviewed">미검수</option>
        <option value="pass">통과</option>
        <option value="hold">보류</option>
        <option value="reject">반려</option>
      </select>
      <select id="sort">
        <option value="recent">최근 생성순</option>
        <option value="reviewed">최근 검수순</option>
        <option value="status">검수 상태순</option>
        <option value="species">생물명순</option>
        <option value="name">파일명순</option>
        <option value="size">파일 크기순</option>
      </select>
      <button class="refresh-button" id="refreshImages" type="button" title="최신 이미지 목록 불러오기" aria-label="이미지 목록 새로고침">&#x21bb;</button>
    </div>
  </header>
  <main id="reviewWorkspace" data-density="comfortable">
    <section class="browser-pane" id="browserPane" aria-label="이미지 목록">
      <div class="browser-pane-toolbar">
        <div class="browser-pane-title">
          <strong>이미지 목록</strong>
          <span class="list-status" id="listStatus"></span>
        </div>
        <div class="browser-actions">
          <div class="density-control" role="group" aria-label="카드 크기">
            <button data-density="compact" type="button" title="작은 카드" aria-label="작은 카드">
              <span class="density-icon compact" aria-hidden="true"></span>
            </button>
            <button class="active" data-density="comfortable" type="button" title="보통 카드" aria-label="보통 카드">
              <span class="density-icon comfortable" aria-hidden="true"></span>
            </button>
            <button data-density="large" type="button" title="큰 카드" aria-label="큰 카드">
              <span class="density-icon large" aria-hidden="true"></span>
            </button>
          </div>
          <button class="panel-toggle" id="toggleDetail" type="button" title="상세 패널 접기" aria-label="상세 패널 접기" aria-pressed="false">
            <span class="panel-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <section class="grid" id="grid" aria-live="polite"></section>
      <button class="load-more" id="loadMore" type="button" hidden></button>
    </section>
    <div
      class="pane-resizer"
      id="paneResizer"
      role="separator"
      aria-label="목록과 상세 패널 너비 조절"
      aria-orientation="vertical"
      aria-valuemin="35"
      aria-valuemax="70"
      aria-valuenow="52"
      tabindex="0"
    ></div>
    <aside id="detail"></aside>
  </main>
  <div class="zoom" id="zoom" hidden>
    <div class="zoom-bar">
      <div class="zoom-title" id="zoomTitle"></div>
      <div class="zoom-tools">
        <span class="zoom-count" id="zoomCount"></span>
        <button id="zoomActual" type="button" title="원본 크기로 보기" aria-label="원본 크기로 보기" aria-pressed="false">1:1</button>
        <button id="zoomClose" type="button">닫기</button>
      </div>
    </div>
    <div class="zoom-stage" id="zoomBackdrop">
      <img id="zoomImage" alt="">
    </div>
    <button class="zoom-nav prev" id="zoomPrev" type="button" aria-label="이전 이미지">&lsaquo;</button>
    <button class="zoom-nav next" id="zoomNext" type="button" aria-label="다음 이미지">&rsaquo;</button>
    <div class="zoom-caption">
      <div class="zoom-file mono" id="zoomFile"></div>
      <div class="row" id="zoomTags"></div>
    </div>
  </div>
  <script>
    const key = new URLSearchParams(location.search).get("key") || "";
    const fmt = new Intl.NumberFormat("ko-KR");
    const KIND_LABELS = {
      audit: "감사",
      candidate: "후보",
      controlnet: "컨트롤넷",
      ecology: "생태 장면",
      gallery: "갤러리",
      i2i: "이미지 보정",
      imagegen: "이미지 생성",
      inpaint: "인페인트",
      lora: "LoRA",
      pattern: "무늬 변형",
      reference: "참고",
      "count-level pass": "대표 후보",
      "review hold": "검수 후보",
      "anatomy review": "해부학 검수",
      "structure reference": "구조 참고",
      "invalid candidate": "손상 후보",
    };
    const STATUS_LABELS = {
      all: "전체 상태",
      unreviewed: "미검수",
      pass: "통과",
      hold: "보류",
      reject: "반려",
    };
    const ATLAS_MEDIA_EXTENSIONS = new Set([".png", ".jpg", ".jpeg", ".webp"]);
    const MANAGED_MEDIA_EXTENSIONS = new Set([".png"]);
    let images = [];
    let selected = null;
    let selectedStatus = "unreviewed";
    let imageListSignature = "";
    let refreshInFlight = false;
    let saveInFlight = false;
    let candidateActionInFlight = false;
    let zoomActualSize = false;
    const REVIEW_LAYOUT_KEY = "dino-review-layout-v3";
    const LIST_BATCH_SIZE = 120;
    let visibleLimit = LIST_BATCH_SIZE;
    let lastFilterSignature = "";
    let layoutState = loadLayoutState();

    const $ = (id) => document.getElementById(id);

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function loadLayoutState() {
      const defaults = {
        density: "comfortable",
        detailCollapsed: true,
        detailFocused: false,
        listPaneWidth: Math.round(window.innerWidth * 0.52),
      };
      try {
        const saved = JSON.parse(localStorage.getItem(REVIEW_LAYOUT_KEY) || "{}");
        return {
          density: ["compact", "comfortable", "large"].includes(saved.density)
            ? saved.density
            : defaults.density,
          detailCollapsed:
            typeof saved.detailCollapsed === "boolean"
              ? saved.detailCollapsed
              : defaults.detailCollapsed,
          detailFocused:
            typeof saved.detailFocused === "boolean"
              ? saved.detailFocused
              : defaults.detailFocused,
          listPaneWidth: Number.isFinite(saved.listPaneWidth)
            ? saved.listPaneWidth
            : defaults.listPaneWidth,
        };
      } catch {
        return defaults;
      }
    }

    function saveLayoutState() {
      try {
        localStorage.setItem(REVIEW_LAYOUT_KEY, JSON.stringify(layoutState));
      } catch {
        // Layout preferences are optional when storage is unavailable.
      }
    }

    function isNarrowLayout() {
      return window.matchMedia("(max-width: 820px)").matches;
    }

    function listPaneBounds() {
      const width = $("reviewWorkspace")?.clientWidth || window.innerWidth;
      const compactDesktop = window.innerWidth <= 1180;
      const minimum = compactDesktop ? 380 : 420;
      const detailMinimum = compactDesktop ? 360 : 420;
      return {
        minimum: Math.min(minimum, Math.max(280, width - detailMinimum)),
        maximum: Math.max(minimum, width - detailMinimum - 8),
        width,
      };
    }

    function updateDetailToggle() {
      const button = $("toggleDetail");
      if (!button) return;
      const visible = isNarrowLayout()
        ? document.body.classList.contains("detail-open") || layoutState.detailFocused
        : !layoutState.detailCollapsed || layoutState.detailFocused;
      button.setAttribute("aria-pressed", String(visible));
      button.setAttribute("aria-label", visible ? "상세 패널 접기" : "상세 패널 열기");
      button.title = visible ? "상세 패널 접기" : "상세 패널 열기";
    }

    function setListPaneWidth(nextWidth, { persist = true } = {}) {
      const bounds = listPaneBounds();
      layoutState.listPaneWidth = clamp(Math.round(nextWidth), bounds.minimum, bounds.maximum);
      document.documentElement.style.setProperty("--list-pane-width", `${layoutState.listPaneWidth}px`);
      const percent = Math.round((layoutState.listPaneWidth / bounds.width) * 100);
      $("paneResizer")?.setAttribute("aria-valuenow", String(percent));
      if (persist) saveLayoutState();
    }

    function setDensity(density) {
      if (!["compact", "comfortable", "large"].includes(density)) return;
      layoutState.density = density;
      $("reviewWorkspace").dataset.density = density;
      document.querySelectorAll(".density-control [data-density]").forEach((button) => {
        button.classList.toggle("active", button.dataset.density === density);
      });
      saveLayoutState();
    }

    function setDetailCollapsed(collapsed) {
      layoutState.detailCollapsed = Boolean(collapsed);
      if (layoutState.detailCollapsed) layoutState.detailFocused = false;
      document.body.classList.toggle("detail-collapsed", layoutState.detailCollapsed);
      document.body.classList.toggle("detail-focused", layoutState.detailFocused);
      if (layoutState.detailCollapsed) document.body.classList.remove("detail-open");
      updateDetailToggle();
      saveLayoutState();
    }

    function setDetailFocused(focused) {
      layoutState.detailFocused = Boolean(focused);
      if (layoutState.detailFocused) layoutState.detailCollapsed = false;
      document.body.classList.toggle("detail-collapsed", layoutState.detailCollapsed);
      document.body.classList.toggle("detail-focused", layoutState.detailFocused);
      if (!isNarrowLayout()) document.body.classList.remove("detail-open");
      updateDetailToggle();
      saveLayoutState();
      renderDetail();
    }

    function openDetailPane({ preferFocus = false } = {}) {
      if (isNarrowLayout()) {
        document.body.classList.add("detail-open");
      } else {
        if (preferFocus) setDetailFocused(true);
        else setDetailCollapsed(false);
      }
      updateDetailToggle();
    }

    function closeDetailPane() {
      if (isNarrowLayout()) {
        document.body.classList.remove("detail-open");
        if (layoutState.detailFocused) setDetailFocused(false);
      } else {
        setDetailCollapsed(true);
      }
      updateDetailToggle();
    }

    function applyLayoutState() {
      setDensity(layoutState.density);
      setListPaneWidth(layoutState.listPaneWidth, { persist: false });
      if (layoutState.detailCollapsed) layoutState.detailFocused = false;
      document.body.classList.toggle("detail-collapsed", layoutState.detailCollapsed);
      document.body.classList.toggle("detail-focused", layoutState.detailFocused);
      if (!isNarrowLayout()) document.body.classList.remove("detail-open");
      updateDetailToggle();
    }

    function setupPaneResizer() {
      const resizer = $("paneResizer");
      if (!resizer) return;
      let startX = 0;
      let startWidth = 0;

      resizer.addEventListener("pointerdown", (event) => {
        if (isNarrowLayout()) return;
        startX = event.clientX;
        startWidth = layoutState.listPaneWidth;
        document.body.classList.add("resizing-panes");
        resizer.setPointerCapture(event.pointerId);
      });
      resizer.addEventListener("pointermove", (event) => {
        if (!document.body.classList.contains("resizing-panes")) return;
        setListPaneWidth(startWidth + event.clientX - startX, { persist: false });
      });
      const stopResize = (event) => {
        if (!document.body.classList.contains("resizing-panes")) return;
        document.body.classList.remove("resizing-panes");
        if (resizer.hasPointerCapture(event.pointerId)) resizer.releasePointerCapture(event.pointerId);
        saveLayoutState();
      };
      resizer.addEventListener("pointerup", stopResize);
      resizer.addEventListener("pointercancel", stopResize);
      resizer.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        const direction = event.key === "ArrowLeft" ? -1 : 1;
        setListPaneWidth(layoutState.listPaneWidth + direction * (event.shiftKey ? 64 : 24));
      });
      resizer.addEventListener("dblclick", () => {
        setListPaneWidth(listPaneBounds().width * 0.52);
      });
    }

    function api(path) {
      const sep = path.includes("?") ? "&" : "?";
      return `${path}${key ? `${sep}key=${encodeURIComponent(key)}` : ""}`;
    }

    function isSafeMediaFilenameSegment(segment, extensions) {
      let filename = "";
      try {
        filename = decodeURIComponent(String(segment || ""));
      } catch {
        return false;
      }
      if (!filename || filename === "." || filename === ".." || /[\\/\0\u0000-\u001f\u007f]/.test(filename)) {
        return false;
      }
      const dot = filename.lastIndexOf(".");
      return dot > 0 && extensions.has(filename.slice(dot).toLowerCase());
    }

    function imageUrl(image) {
      const rawUrl = String(image?.url || "");
      const fixedPlaceholder = rawUrl === "/review-placeholder"
        || rawUrl === "/invalid-review-image"
        || rawUrl === "/placeholder/invalid.svg";
      const atlasMatch = rawUrl.match(/^\/image\/([^/?#]+)$/);
      const managedMatch = rawUrl.match(
        /^\/(?:pending-media|promoted-media|quarantine-media)\/([a-z0-9][a-z0-9-]{0,79})\/([^/?#]+)$/,
      );
      const safeAtlas = atlasMatch && isSafeMediaFilenameSegment(atlasMatch[1], ATLAS_MEDIA_EXTENSIONS);
      const safeManaged = managedMatch && isSafeMediaFilenameSegment(managedMatch[2], MANAGED_MEDIA_EXTENSIONS);
      if (!fixedPlaceholder && !safeAtlas && !safeManaged) return api("/placeholder/invalid.svg");
      const sep = rawUrl.includes("?") ? "&" : "?";
      const version = `${String(image?.updatedAt || "unknown")}-${Number(image?.sizeBytes) || 0}`;
      return api(`${rawUrl}${sep}v=${encodeURIComponent(version)}`);
    }

    function hasUnsavedReview() {
      const note = $("note");
      if (!isReviewMutable(selected) || !note) return false;
      return note.value !== (selected.review?.note || "") || selectedStatus !== statusOf(selected);
    }

    function listSignature(list) {
      return list.map((image) => [
        image.id,
        image.updatedAt,
        image.sizeBytes,
        image.kind,
        image.species,
        scopeOf(image),
        image.state || "",
        image.loadError === true,
        image.canPromote || false,
        (Array.isArray(image.metadataIssues) ? image.metadataIssues : []).join(","),
        JSON.stringify(image.provenance || {}),
        JSON.stringify(image.anatomyReview || {}),
        JSON.stringify(image.promotionRecord || null),
        image.review?.status || "",
        image.review?.note || "",
        image.review?.updatedAt || "",
      ].join(":")).join("|");
    }

    function currentFilterState() {
      return {
        search: $("search").value,
        scope: $("scope").value,
        species: $("species").value,
        kind: $("kind").value,
        status: $("status").value,
        sort: $("sort").value,
      };
    }

    function restoreFilterState(state) {
      Object.entries(state).forEach(([id, value]) => {
        const control = $(id);
        if (!control) return;
        if (control.tagName === "SELECT" && ![...control.options].some((option) => option.value === value)) return;
        control.value = value;
      });
    }

    function statusOf(image) {
      return image.review?.status || "unreviewed";
    }

    function bytes(value) {
      const size = Number(value);
      if (!Number.isFinite(size) || size < 0) return "크기 미상";
      if (size > 1024 * 1024) return `${(size / 1024 / 1024).toFixed(1)} MB`;
      return `${Math.round(size / 1024)} KB`;
    }

    function rel(value) {
      const time = new Date(value).getTime();
      if (!Number.isFinite(time)) return "시간 미상";
      const ms = Math.max(0, Date.now() - time);
      if (ms < 3600000) return `${Math.max(1, Math.floor(ms / 60000))}분 전`;
      if (ms < 86400000) return `${Math.floor(ms / 3600000)}시간 전`;
      return `${Math.floor(ms / 86400000)}일 전`;
    }

    function statusPill(status) {
      const cls = status === "pass" ? "status-pass" : status === "hold" ? "status-hold" : status === "reject" ? "status-reject" : "";
      return `<span class="pill ${cls}">${escapeHtml(STATUS_LABELS[status] || status)}</span>`;
    }

    function scopeOf(image) {
      const scope = String(image?.scope || "");
      return ["pending", "integration", "atlas"].includes(scope) ? scope : "unknown";
    }

    function isMutablePending(image) {
      return scopeOf(image) === "pending" && image?.loadError === false;
    }

    function isReviewMutable(image) {
      return isMutablePending(image) || scopeOf(image) === "atlas";
    }

    function scopePill(scope) {
      const raw = String(scope || "");
      const normalized = ["pending", "integration", "atlas"].includes(raw) ? raw : "unknown";
      const labels = {
        pending: "검수 대기",
        integration: "앱 등록 대기",
        atlas: "등록 자산",
        unknown: raw ? `미분류: ${raw}` : "미분류",
      };
      return `<span class="pill scope-${normalized}">${escapeHtml(labels[normalized])}</span>`;
    }

    function kindLabel(kind) {
      return KIND_LABELS[kind] || kind;
    }

    function metadataIssuesHtml(image) {
      const issues = Array.isArray(image.metadataIssues) ? image.metadataIssues : [];
      return issues.length
        ? `<ul class="metadata-issues">${issues.map((issue) => `<li>${escapeHtml(issue)}</li>`).join("")}</ul>`
        : `<div class="meta-line">필수 항목 입력 완료</div>`;
    }

    function metadataValue(value) {
      if (value === true) return "예";
      if (value === false) return "아니오";
      if (value === null || value === undefined || value === "") return "미입력";
      return String(value);
    }

    function metadataDetails(image) {
      const provenance = image?.provenance && typeof image.provenance === "object"
        ? image.provenance
        : {};
      const anatomy = image?.anatomyReview && typeof image.anatomyReview === "object"
        ? image.anatomyReview
        : {};
      const provenanceRows = [
        ["출처", provenance.source],
        ["라이선스", provenance.license],
        ["프롬프트", provenance.prompt],
        ["시드", provenance.seed],
        ["워크플로", provenance.workflow],
      ];
      const anatomyRows = [
        ["상태", anatomy.status],
        ["대표 이미지", anatomy.representative],
        ["검수자", anatomy.reviewer],
        ["검수 시각", anatomy.reviewedAt],
        ["해부학 메모", anatomy.notes],
      ];
      const rows = (items) => items.map(([label, value]) => `
        <dt>${escapeHtml(label)}</dt><dd>${escapeHtml(metadataValue(value))}</dd>
      `).join("");
      return `<details class="metadata-details">
        <summary>출처·생성·해부학 메타데이터</summary>
        <div class="metadata-sections">
          <section class="metadata-section">
            <h3>출처 및 생성 기록</h3>
            <dl class="metadata-grid">${rows(provenanceRows)}</dl>
          </section>
          <section class="metadata-section">
            <h3>해부학 검수 기록</h3>
            <dl class="metadata-grid">${rows(anatomyRows)}</dl>
          </section>
        </div>
      </details>`;
    }

    function promotionRecordText(record) {
      if (record === null || record === undefined || record === "") return "기록 없음";
      if (typeof record === "string") return record;
      try {
        return JSON.stringify(record, null, 2);
      } catch {
        return String(record);
      }
    }

    function inventoryPanel(image) {
      const scope = scopeOf(image);
      if (scope !== "pending" && scope !== "integration") return "";
      const targetPath = image.targetPath || image.destination || "승격 경로 미지정";
      const metadata = metadataDetails(image);
      const issuesHtml = metadataIssuesHtml(image);

      if (image.loadError === true && scope === "pending") {
        return `${metadata}<section class="read-only-panel" aria-label="손상 후보 안내">
          <strong>읽기 전용 손상 후보</strong>
          ${issuesHtml}
          <div class="meta-line">후보 폴더의 이미지와 candidate.json을 수정한 뒤 새로고침해 주세요. 이 항목에서는 검수 저장·승격·삭제를 실행할 수 없습니다.</div>
        </section>`;
      }

      if (scope === "integration") {
        return `${metadata}<section class="read-only-panel" aria-label="앱 등록 대기 자산">
          <strong>앱 등록 대기 · 읽기 전용</strong>
          <div class="meta-line">상태: <span class="mono">${escapeHtml(image.state || "promoted-awaiting-app-integration")}</span></div>
          <div class="meta-line">자산 위치: <span class="mono">${escapeHtml(targetPath)}</span></div>
          ${issuesHtml}
          <div class="meta-line">app.js와 관련 메타데이터 등록 및 별도 검수를 마치기 전에는 사용자 앱에 공개하지 않습니다.</div>
          <div class="meta-line">승격 기록</div>
          <pre class="promotion-record">${escapeHtml(promotionRecordText(image.promotionRecord))}</pre>
        </section>`;
      }

      const reviewStatus = statusOf(image);
      const promoteDisabled = image.canPromote && reviewStatus === "pass" ? "" : "disabled";
      const deleteDisabled = reviewStatus === "reject" ? "" : "disabled";
      return `${metadata}<section class="candidate-panel" aria-label="검수 대기 자산 처리">
        <strong>검수 대기 자산</strong>
        <div class="meta-line">상태: <span class="mono">${escapeHtml(image.state || "pending")}</span></div>
        <div class="meta-line">승격 위치: <span class="mono">${escapeHtml(targetPath)}</span></div>
        ${issuesHtml}
        <div class="candidate-actions">
          <button class="promote" id="promoteCandidate" type="button" ${promoteDisabled}>자산 승격</button>
          <button class="delete" id="deleteCandidate" type="button" ${deleteDisabled}>완전 탈락 삭제</button>
        </div>
        <div class="meta-line">승격 후에는 앱 데이터·해부학 메타데이터 등록을 마쳐야 공개됩니다.</div>
        <div class="meta-line" id="candidateActionState" role="status" aria-live="polite"></div>
      </section>`;
    }

    function splitSpeciesLabel(label) {
      const match = String(label || "").match(/^(.*?)\s*\((.+)\)$/);
      return match
        ? { common: match[1], scientific: match[2] }
        : { common: String(label || ""), scientific: "" };
    }

    function filtered() {
      const q = $("search").value.trim().toLowerCase();
      const scope = $("scope").value;
      const species = $("species").value;
      const kind = $("kind").value;
      const status = $("status").value;
      const statusRank = { unreviewed: 0, hold: 1, reject: 2, pass: 3 };
      return images.filter((image) => {
        const hay = `${image.name} ${image.species} ${image.speciesLabel} ${image.kind} ${kindLabel(image.kind)}`.toLowerCase();
        return (!q || hay.includes(q))
          && (scope === "all" || scopeOf(image) === scope)
          && (species === "all" || image.species === species)
          && (kind === "all" || image.kind === kind)
          && (status === "all" || statusOf(image) === status);
      }).sort((a, b) => {
        const sort = $("sort").value;
        if (sort === "reviewed") return new Date(b.review?.updatedAt || 0) - new Date(a.review?.updatedAt || 0);
        if (sort === "status") return statusRank[statusOf(a)] - statusRank[statusOf(b)] || new Date(b.updatedAt) - new Date(a.updatedAt);
        if (sort === "species") return String(a.speciesLabel || "").localeCompare(String(b.speciesLabel || ""), "ko") || String(a.name || "").localeCompare(String(b.name || ""), "ko");
        if (sort === "name") return String(a.name || "").localeCompare(String(b.name || ""), "ko");
        if (sort === "size") return (Number(b.sizeBytes) || 0) - (Number(a.sizeBytes) || 0);
        return new Date(b.updatedAt) - new Date(a.updatedAt);
      });
    }

    function renderSummary(list) {
      const counts = images.reduce((acc, image) => {
        acc[statusOf(image)] = (acc[statusOf(image)] || 0) + 1;
        const scope = scopeOf(image);
        acc[scope] = (acc[scope] || 0) + 1;
        return acc;
      }, {});
      $("summary").innerHTML = [
        `<span class="pill">${fmt.format(list.length)}개 표시</span>`,
        `<span class="pill">전체 ${fmt.format(images.length)}개</span>`,
        `<span class="pill scope-pending">대기 ${fmt.format(counts.pending || 0)}</span>`,
        `<span class="pill scope-integration">앱 등록 대기 ${fmt.format(counts.integration || 0)}</span>`,
        `<span class="pill scope-atlas">등록 ${fmt.format(counts.atlas || 0)}</span>`,
        counts.unknown ? `<span class="pill scope-unknown">미분류 ${fmt.format(counts.unknown)}</span>` : "",
        `<span class="pill status-pass">통과 ${fmt.format(counts.pass || 0)}</span>`,
        `<span class="pill status-hold">보류 ${fmt.format(counts.hold || 0)}</span>`,
        `<span class="pill status-reject">반려 ${fmt.format(counts.reject || 0)}</span>`,
      ].join("");
    }

    function renderGrid({ resetLimit = false } = {}) {
      const list = filtered();
      const filterSignature = JSON.stringify(currentFilterState());
      const shouldResetList = resetLimit || filterSignature !== lastFilterSignature;
      if (shouldResetList) {
        visibleLimit = LIST_BATCH_SIZE;
        lastFilterSignature = filterSignature;
      }
      const visible = list.slice(0, visibleLimit);
      renderSummary(list);
      $("listStatus").textContent = `${fmt.format(visible.length)} / ${fmt.format(list.length)}`;
      $("loadMore").hidden = visible.length >= list.length;
      $("loadMore").textContent = `${fmt.format(Math.min(LIST_BATCH_SIZE, list.length - visible.length))}장 더 보기`;
      $("grid").innerHTML = visible.length ? visible.map((image) => {
        const active = selected?.id === image.id ? "active" : "";
        const src = imageUrl(image);
        const status = statusOf(image);
        const species = splitSpeciesLabel(image.speciesLabel);
        return `<button class="card ${active}" data-id="${escapeHtml(image.id)}" type="button" aria-label="${escapeHtml(`${image.speciesLabel}, ${kindLabel(image.kind)}, ${STATUS_LABELS[status] || status}`)}">
          <img class="thumb" loading="lazy" src="${escapeHtml(src)}" alt="${escapeHtml(image.speciesLabel)}">
          <div class="meta">
            <div class="card-heading">
              <div class="card-name-block">
                <div class="card-species">${escapeHtml(species.common)}</div>
                ${species.scientific ? `<div class="card-scientific">${escapeHtml(species.scientific)}</div>` : ""}
              </div>
              ${statusPill(status)}
            </div>
            <div class="card-kind">${escapeHtml(kindLabel(image.kind))}</div>
            <div class="row">${scopePill(image.scope)}</div>
            <div class="file-name" title="${escapeHtml(image.name)}">${escapeHtml(image.name)}</div>
            <div class="card-footer"><span>${bytes(image.sizeBytes)}</span><span>${rel(image.updatedAt)}</span></div>
          </div>
        </button>`;
      }).join("") : `<div class="empty-state">조건에 맞는 이미지가 없습니다.</div>`;
      document.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("click", () => selectImage(card.dataset.id, { openDetail: true }));
      });
      if (shouldResetList) $("browserPane").scrollTop = 0;
    }

    function selectImage(id, { openDetail = false } = {}) {
      const preferFocus = openDetail && !isNarrowLayout() && layoutState.detailCollapsed;
      selected = images.find((image) => image.id === id) || images[0] || null;
      selectedStatus = selected ? statusOf(selected) : "unreviewed";
      renderGrid();
      renderDetail();
      if (openDetail) openDetailPane({ preferFocus });
    }

    function getSelectedSpeciesImages() {
      if (!selected) return [];
      const filteredSpecies = filtered().filter((image) => image.species === selected.species);
      if (filteredSpecies.some((image) => image.id === selected.id)) return filteredSpecies;
      const selectedScope = scopeOf(selected);
      return images
        .filter((image) => image.species === selected.species && scopeOf(image) === selectedScope)
        .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    }

    function moveSelection(direction) {
      const items = getSelectedSpeciesImages();
      if (items.length < 2 || !selected) return;
      const currentIndex = Math.max(0, items.findIndex((image) => image.id === selected.id));
      const nextIndex = (currentIndex + direction + items.length) % items.length;
      selected = items[nextIndex];
      selectedStatus = statusOf(selected);
      renderGrid();
      renderDetail();
      if (!$("zoom").hidden) renderZoom();
    }

    function renderDetail() {
      if (!selected) {
        $("detail").innerHTML = `
          <div class="detail-pane-bar">
            <strong>선택 이미지</strong>
            <button class="detail-close" id="closeDetail" type="button" title="상세 패널 접기" aria-label="상세 패널 접기">&#x2715;</button>
          </div>
          <div class="detail"><p class="muted">선택된 이미지가 없습니다.</p></div>`;
        $("closeDetail").addEventListener("click", closeDetailPane);
        return;
      }
      const speciesImages = getSelectedSpeciesImages();
      const selectedIndex = Math.max(
        0,
        speciesImages.findIndex((image) => image.id === selected.id),
      );
      const navigationDisabled = speciesImages.length < 2 ? "disabled" : "";
      const focusTitle = layoutState.detailFocused ? "분할 보기" : "상세 화면 확장";
      const mutable = isReviewMutable(selected);
      const savedNote = selected.review?.note || "";
      const readOnlyReason = selected.loadError === true
        ? "손상 후보는 원본 파일을 수정한 뒤 새로고침해야 합니다."
        : scopeOf(selected) === "integration"
          ? "앱 등록 대기 항목은 승격 이력을 보존하기 위해 읽기 전용입니다."
          : "범위를 확인할 수 없는 항목은 안전을 위해 읽기 전용입니다.";
      const reviewControls = mutable
        ? `<div class="actions">
            <button data-status="unreviewed" type="button" aria-pressed="${selectedStatus === "unreviewed"}">초기화</button>
            <button data-status="pass" type="button" aria-pressed="${selectedStatus === "pass"}">통과</button>
            <button data-status="hold" type="button" aria-pressed="${selectedStatus === "hold"}">보류</button>
            <button data-status="reject" type="button" aria-pressed="${selectedStatus === "reject"}">반려</button>
          </div>
          <textarea id="note" placeholder="검수 메모">${escapeHtml(savedNote)}</textarea>
          <div class="save-row">
            <button id="save" type="button">저장</button>
            <span class="muted" id="saveState">${selected.review?.updatedAt ? `${rel(selected.review.updatedAt)} 저장됨` : ""}</span>
          </div>`
        : `<section class="read-only-panel" aria-label="읽기 전용 검수 기록">
            <strong>검수 기록 · 읽기 전용</strong>
            <div class="meta-line">${escapeHtml(readOnlyReason)}</div>
            <div class="meta-line">저장된 메모: ${savedNote ? escapeHtml(savedNote) : "없음"}</div>
            ${selected.review?.updatedAt ? `<div class="meta-line">저장 시각: ${escapeHtml(selected.review.updatedAt)}</div>` : ""}
          </section>`;
      const strip = speciesImages.map((image) => `
        <button
          class="${image.id === selected.id ? "active" : ""}"
          data-detail-image="${escapeHtml(image.id)}"
          type="button"
          title="${escapeHtml(image.name)}"
          aria-label="${escapeHtml(`${kindLabel(image.kind)} 이미지 선택`)}"
        >
          <img loading="lazy" src="${escapeHtml(imageUrl(image))}" alt="${escapeHtml(image.speciesLabel)}">
          <span class="strip-kind">${escapeHtml(kindLabel(image.kind))}</span>
        </button>
      `).join("");
      $("detail").innerHTML = `
        <div class="detail-pane-bar">
          <strong>선택 이미지</strong>
          <div class="detail-pane-actions">
            <span class="detail-position">${selectedIndex + 1} / ${speciesImages.length}</span>
            <button class="detail-action" id="previousDetail" type="button" title="이전 이미지" aria-label="이전 이미지" ${navigationDisabled}>&lsaquo;</button>
            <button class="detail-action" id="nextDetail" type="button" title="다음 이미지" aria-label="다음 이미지" ${navigationDisabled}>&rsaquo;</button>
            <button class="detail-action" id="toggleDetailFocus" type="button" title="${focusTitle}" aria-label="${focusTitle}" aria-pressed="${layoutState.detailFocused}">&#x26F6;</button>
            <button class="detail-close" id="closeDetail" type="button" title="상세 패널 접기" aria-label="상세 패널 접기">&#x2715;</button>
          </div>
        </div>
        <div class="detail-layout">
          <div class="detail-preview-column">
            <button class="preview-button" id="openZoom" type="button" title="크게 보기">
              <img class="preview" src="${escapeHtml(imageUrl(selected))}" alt="${escapeHtml(selected.speciesLabel)}">
            </button>
            <div class="species-strip" aria-label="같은 생물 이미지">${strip}</div>
          </div>
          <div class="detail">
            <h2>${escapeHtml(selected.speciesLabel)}</h2>
            <div class="detail-file-name mono">${escapeHtml(selected.name)}</div>
            <div class="row">
              ${statusPill(statusOf(selected))}
              ${scopePill(selected.scope)}
              <span class="pill">${escapeHtml(kindLabel(selected.kind))}</span>
            </div>
            <div class="muted mono">${escapeHtml(selected.id)}</div>
            ${reviewControls}
            ${inventoryPanel(selected)}
          </div>
        </div>`;
      if (mutable) {
        document.querySelectorAll("[data-status]").forEach((button) => {
          if (button.dataset.status === selectedStatus) button.classList.add("active");
          button.addEventListener("click", () => {
            selectedStatus = button.dataset.status;
            document.querySelectorAll("[data-status]").forEach((node) => {
              node.classList.remove("active");
              node.setAttribute("aria-pressed", "false");
            });
            button.classList.add("active");
            button.setAttribute("aria-pressed", "true");
          });
        });
        $("save").addEventListener("click", saveReview);
      }
      $("promoteCandidate")?.addEventListener("click", () => runCandidateAction("promote"));
      $("deleteCandidate")?.addEventListener("click", () => runCandidateAction("delete"));
      $("openZoom").addEventListener("click", openZoom);
      $("closeDetail").addEventListener("click", closeDetailPane);
      $("previousDetail").addEventListener("click", () => moveSelection(-1));
      $("nextDetail").addEventListener("click", () => moveSelection(1));
      $("toggleDetailFocus").addEventListener("click", () =>
        setDetailFocused(!layoutState.detailFocused),
      );
      document.querySelectorAll("[data-detail-image]").forEach((button) => {
        button.addEventListener("click", () => selectImage(button.dataset.detailImage));
      });
      if (layoutState.detailFocused) {
        requestAnimationFrame(() => {
          document.querySelector(".species-strip button.active")?.scrollIntoView({
            block: "nearest",
            inline: "center",
          });
        });
      }
    }

    function renderZoom() {
      if (!selected) return;
      const items = getSelectedSpeciesImages();
      const index = Math.max(0, items.findIndex((image) => image.id === selected.id));
      $("zoomTitle").textContent = selected.name;
      $("zoomFile").textContent = selected.id;
      $("zoomCount").textContent = `${index + 1} / ${items.length}`;
      $("zoomTags").innerHTML = [
        statusPill(statusOf(selected)),
        scopePill(selected.scope),
        `<span class="pill">${escapeHtml(kindLabel(selected.kind))}</span>`,
        `<span class="pill">${escapeHtml(selected.speciesLabel)}</span>`,
      ].join("");
      $("zoomImage").src = imageUrl(selected);
      $("zoomImage").alt = selected.speciesLabel;
      $("zoomPrev").disabled = items.length < 2;
      $("zoomNext").disabled = items.length < 2;
    }

    function setZoomActualSize(actualSize) {
      zoomActualSize = Boolean(actualSize);
      $("zoom").classList.toggle("actual-size", zoomActualSize);
      $("zoomActual").setAttribute("aria-pressed", String(zoomActualSize));
      $("zoomActual").textContent = zoomActualSize ? "맞춤" : "1:1";
      $("zoomActual").title = zoomActualSize ? "화면에 맞추기" : "원본 크기로 보기";
      $("zoomActual").setAttribute(
        "aria-label",
        zoomActualSize ? "화면에 맞추기" : "원본 크기로 보기",
      );
      if (!zoomActualSize) {
        $("zoomBackdrop").scrollTo({ left: 0, top: 0 });
      }
    }

    function openZoom() {
      if (!selected) return;
      renderZoom();
      $("zoom").hidden = false;
      document.body.classList.add("zoom-open");
      setZoomActualSize(false);
    }

    function closeZoom() {
      $("zoom").hidden = true;
      $("zoomImage").removeAttribute("src");
      setZoomActualSize(false);
      document.body.classList.remove("zoom-open");
    }

    function mutationHeaders() {
      const headers = { "content-type": "application/json" };
      if (key) headers["x-dino-review-key"] = key;
      return headers;
    }

    async function runCandidateAction(action) {
      if (!isMutablePending(selected) || candidateActionInFlight) return;
      const target = selected;
      const state = $("candidateActionState");
      if (hasUnsavedReview()) {
        state.textContent = "검수 상태와 메모를 먼저 저장해 주세요.";
        return;
      }

      let confirmName = "";
      if (action === "promote") {
        if (statusOf(target) !== "pass" || !target.canPromote) {
          state.textContent = "통과 저장과 필수 항목 입력이 모두 필요합니다.";
          return;
        }
        if (!window.confirm(`${target.name}\n\n추적 자산 폴더로 옮길까요?\n앱 공개 등록은 별도 단계로 남습니다.`)) return;
      } else {
        if (statusOf(target) !== "reject") {
          state.textContent = "반려 상태를 저장한 뒤 삭제할 수 있습니다.";
          return;
        }
        if (!target.review?.note?.trim()) {
          state.textContent = "완전 탈락 사유를 메모에 남겨 주세요.";
          return;
        }
        confirmName = window.prompt("완전 삭제하려면 파일명을 그대로 입력하세요.", "") || "";
        if (confirmName !== target.name) {
          state.textContent = "파일명이 일치하지 않아 삭제하지 않았습니다.";
          return;
        }
      }

      candidateActionInFlight = true;
      $("promoteCandidate")?.setAttribute("disabled", "");
      $("deleteCandidate")?.setAttribute("disabled", "");
      state.textContent = action === "promote" ? "승격 중" : "삭제 중";
      const endpoint = action === "promote" ? "/api/pending/promote" : "/api/pending/delete";
      const payload = action === "promote"
        ? { id: target.id, candidateId: target.candidateId }
        : {
            id: target.id,
            candidateId: target.candidateId,
            confirmName,
            reason: target.review?.note || "",
          };

      try {
        const res = await fetch(api(endpoint), {
          method: "POST",
          headers: mutationHeaders(),
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          state.textContent = data.error || `처리 실패 (HTTP ${res.status})`;
          return;
        }
        window.alert(action === "promote"
          ? `자산으로 옮겼습니다.\n${data.targetPath || data.projectAsset || "앱 등록 대기"}`
          : "완전 탈락 파일을 삭제하고 DB에 이력을 남겼습니다.");
        if (action === "promote") $("scope").value = "integration";
        if (selected?.id === target.id) selected = null;
        await refreshImageList({ force: true });
      } catch (error) {
        state.textContent = `서버 연결 실패: ${error.message}`;
      } finally {
        candidateActionInFlight = false;
        if (selected?.id === target.id) {
          const promote = $("promoteCandidate");
          const remove = $("deleteCandidate");
          if (promote) promote.disabled = !(target.canPromote && statusOf(target) === "pass");
          if (remove) remove.disabled = statusOf(target) !== "reject";
        }
      }
    }

    async function saveReview() {
      if (!isReviewMutable(selected) || saveInFlight) return;
      const target = selected;
      const requestedStatus = selectedStatus;
      const note = $("note");
      if (!note) return;
      const requestedNote = note.value;
      const saveState = $("saveState");
      saveInFlight = true;
      $("save").disabled = true;
      document.querySelectorAll("[data-status]").forEach((button) => { button.disabled = true; });
      saveState.textContent = "저장 중";

      try {
        const res = await fetch(api("/api/review"), {
          method: "POST",
          headers: mutationHeaders(),
          body: JSON.stringify({
            id: target.id,
            candidateId: target.candidateId,
            scope: scopeOf(target),
            status: requestedStatus,
            note: requestedNote,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          saveState.textContent = data.error || `저장 실패 (HTTP ${res.status})`;
          return;
        }

        target.review = data.review;
        if (isMutablePending(target)) {
          target.canPromote = typeof data.canPromote === "boolean" ? data.canPromote : false;
        }
        const idx = images.findIndex((image) => image.id === target.id);
        if (idx >= 0) images[idx] = target;
        if (selected?.id === target.id) {
          selected = target;
          selectedStatus = statusOf(target);
        }

        const visibleImages = filtered();
        if (!selected || !visibleImages.some((image) => image.id === selected.id)) {
          selected = visibleImages[0] || null;
          selectedStatus = selected ? statusOf(selected) : "unreviewed";
        }
        renderGrid();
        renderDetail();
      } catch (error) {
        saveState.textContent = `서버 연결 실패: ${error.message}`;
      } finally {
        saveInFlight = false;
        if (selected?.id === target.id) {
          $("save")?.removeAttribute("disabled");
          document.querySelectorAll("[data-status]").forEach((button) => { button.disabled = false; });
        }
      }
    }

    function fillSelect(id, values, label) {
      $(id).innerHTML = [
        `<option value="all">${label}</option>`,
        ...values.map((value) => {
          const option = typeof value === "string"
            ? { id: value, label: kindLabel(value) }
            : value;
          const suffix = option.count ? ` (${fmt.format(option.count)})` : "";
          return `<option value="${escapeHtml(option.id)}">${escapeHtml(option.label)}${suffix}</option>`;
        }),
      ].join("");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function refreshImageList({ force = false, initial = false } = {}) {
      if (refreshInFlight || (!force && (document.hidden || hasUnsavedReview()))) return;
      refreshInFlight = true;
      $("refreshImages").setAttribute("aria-busy", "true");
      $("refreshImages").disabled = true;
      const selectedId = selected?.id;
      const draft = hasUnsavedReview() && selected
        ? { id: selected.id, note: $("note").value, status: selectedStatus }
        : null;
      const filters = currentFilterState();

      try {
        const res = await fetch(api("/api/images"), { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        $("refreshImages").title = "최신 이미지 목록 불러오기";
        const nextSignature = listSignature(data.images);
        if (!initial && nextSignature === imageListSignature) return;

        images = data.images;
        imageListSignature = nextSignature;
        fillSelect("species", data.species, "전체 생물");
        fillSelect("kind", data.kinds, "전체 유형");
        restoreFilterState(filters);
        const visibleImages = filtered();
        selected = visibleImages.find((image) => image.id === selectedId) || visibleImages[0] || null;
        selectedStatus = selected ? statusOf(selected) : "unreviewed";
        renderGrid();
        renderDetail();

        if (draft && selected?.id === draft.id) {
          selectedStatus = draft.status;
          renderDetail();
          $("note").value = draft.note;
        }
        if (!$("zoom").hidden && selected) renderZoom();
      } catch (error) {
        $("refreshImages").title = "새로고침 실패 - 다시 시도";
        if (initial) throw error;
      } finally {
        refreshInFlight = false;
        $("refreshImages").removeAttribute("aria-busy");
        $("refreshImages").disabled = false;
      }
    }

    async function init() {
      applyLayoutState();
      setupPaneResizer();
      await refreshImageList({ force: true, initial: true });
      ["search", "scope", "species", "kind", "status", "sort"].forEach((id) => {
        $(id).addEventListener("input", () => {
          const visibleImages = filtered();
          if (!selected || !visibleImages.some((image) => image.id === selected.id)) {
            selected = visibleImages[0] || null;
            selectedStatus = selected ? statusOf(selected) : "unreviewed";
          }
          renderGrid({ resetLimit: true });
          renderDetail();
        });
      });
      document.querySelectorAll(".density-control [data-density]").forEach((button) => {
        button.addEventListener("click", () => setDensity(button.dataset.density));
      });
      $("toggleDetail").addEventListener("click", () => {
        if (isNarrowLayout()) {
          if (document.body.classList.contains("detail-open")) closeDetailPane();
          else openDetailPane();
          return;
        }
        setDetailCollapsed(!layoutState.detailCollapsed);
      });
      $("loadMore").addEventListener("click", () => {
        visibleLimit += LIST_BATCH_SIZE;
        renderGrid();
      });
      $("refreshImages").addEventListener("click", () => refreshImageList({ force: true }));
      window.addEventListener("resize", () => {
        setListPaneWidth(layoutState.listPaneWidth, { persist: false });
        if (!isNarrowLayout()) document.body.classList.remove("detail-open");
        updateDetailToggle();
      });
      window.setInterval(() => refreshImageList(), 10000);
    }

    init().catch((error) => {
      const message = String(error?.message || error || "알 수 없는 오류");
      const authenticationError = /HTTP (401|403)/.test(message);
      const label = authenticationError ? "인증 키 확인 필요" : "서버 연결 실패";
      $("summary").innerHTML = `<span class="pill status-reject">${label}</span>`;
      $("grid").innerHTML = `<div class="empty-state" role="alert">${escapeHtml(label)}: ${escapeHtml(message)}</div>`;
    });

    $("zoomClose").addEventListener("click", closeZoom);
    $("zoomPrev").addEventListener("click", () => moveSelection(-1));
    $("zoomNext").addEventListener("click", () => moveSelection(1));
    $("zoomActual").addEventListener("click", () => setZoomActualSize(!zoomActualSize));
    $("zoomImage").addEventListener("click", () => setZoomActualSize(!zoomActualSize));
    $("zoomBackdrop").addEventListener("click", (event) => {
      if (event.target.id === "zoomBackdrop") closeZoom();
    });
    window.addEventListener("keydown", (event) => {
      if (!$("zoom").hidden) {
        if (event.key === "Escape") closeZoom();
        if (event.key === "ArrowLeft") moveSelection(-1);
        if (event.key === "ArrowRight") moveSelection(1);
        return;
      }
      if (event.key !== "Escape") return;
      if (layoutState.detailFocused) {
        setDetailFocused(false);
        return;
      }
      if (document.body.classList.contains("detail-open")) closeDetailPane();
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshImageList();
    });
  </script>
</body>
</html>
